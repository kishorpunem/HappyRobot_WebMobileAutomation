<!DOCTYPE html>
<html>
<head>
<title>Automation Runner</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
}

.container{
width:600px;
margin:auto;
margin-top:50px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

button{
background:green;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

input{
padding:8px;
width:300px;
}

pre{
background:black;
color:lime;
padding:15px;
margin-top:20px;
height:300px;
overflow:auto;
}
</style>

</head>

<body>

<div class="container">

<h2>Automation Test Runner</h2>

<input type="text" id="testName" placeholder="Enter Test Name (example: test_CreateInquiryUAECB.py)">

<button onclick="runTest()">Run Test</button>

<h3>Execution Result</h3>

<pre id="result">Waiting for execution...</pre>

</div>

<script>

const API_URL = "http://127.0.0.1:8000/automation/run-test/CreateInquiryforGCC";

async function runTest() {

    const testName = document.getElementById("testName").value;

    document.getElementById("result").textContent = "Running automation...";

    try {

        const response = await fetch(
            `${API_URL}?test_name=${testName}`,
            {
                method: "POST"
            }
        );

        const data = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        document.getElementById("result").textContent =
            "Error calling API: " + error;

    }
}

</script>

</body>
</html>
