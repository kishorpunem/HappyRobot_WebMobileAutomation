<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automation Execution Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-image: url("C:/Users/kisho/PycharmProjects/HappyRobotAutomationframework/UICode/images/automation_bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:700px;
    background:rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    border-radius:12px;
    padding:30px;
    box-shadow:0px 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0056b3;
}

button:disabled{
    background:gray;
}

.loader{
    border:6px solid #f3f3f3;
    border-top:6px solid #007bff;
    border-radius:50%;
    width:35px;
    height:35px;
    animation: spin 1s linear infinite;
    margin:auto;
    display:none;
}

@keyframes spin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}

.status{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

.pass{
    color:green;
}

.fail{
    color:red;
}

.logs{
    background:black;
    color:#00ff00;
    padding:15px;
    margin-top:20px;
    height:250px;
    overflow:auto;
    border-radius:6px;
    font-size:13px;
}

</style>
</head>

<body>

<div class="container">

<h2>🚀 Automation Test Runner</h2>

<div class="input-group">

<input type="text" id="testName" placeholder="Enter test file (example: test_login.py)">

<button id="runBtn" onclick="runTest()">Run Test</button>

</div>

<div class="loader" id="loader"></div>

<div class="status" id="status"></div>

<div class="logs" id="logs">Execution logs will appear here...</div>

</div>

<script>

const API_URL = "http://127.0.0.1:8000/automation/run-test/CreateInquiryforGCC";

async function runTest(){

const testName = document.getElementById("testName").value;

if(!testName){
alert("Please enter test name");
return;
}

document.getElementById("loader").style.display="block";
document.getElementById("runBtn").disabled=true;
document.getElementById("status").innerHTML="Running automation...";
document.getElementById("logs").textContent="Starting execution...\n";

try{

const response = await fetch(
`${API_URL}?test_name=${testName}`,
{
method:"POST"
});

const data = await response.json();

document.getElementById("loader").style.display="none";
document.getElementById("runBtn").disabled=false;

const result=data.result;

if(result.status==="PASS"){
document.getElementById("status").innerHTML="✅ TEST PASSED";
document.getElementById("status").className="status pass";
}
else{
document.getElementById("status").innerHTML="❌ TEST FAILED";
document.getElementById("status").className="status fail";
}

document.getElementById("logs").textContent=result.stdout + "\n" + result.stderr;

}catch(error){

document.getElementById("loader").style.display="none";
document.getElementById("runBtn").disabled=false;

document.getElementById("status").innerHTML="API Connection Error";
document.getElementById("status").className="status fail";

document.getElementById("logs").textContent=error;

}

}

</script>

</body>
</html>
