<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automation Jenkins Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.header{
background:#020617;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.run-all{
background:#22c55e;
border:none;
padding:10px 20px;
border-radius:6px;
color:white;
font-weight:bold;
cursor:pointer;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
}

.pass{color:#22c55e;}
.fail{color:#ef4444;}

button.run{
background:#3b82f6;
border:none;
padding:6px 12px;
border-radius:5px;
color:white;
cursor:pointer;
}

.logs{
background:black;
color:#00ff00;
padding:15px;
height:200px;
overflow:auto;
font-family:monospace;
}

.history{
height:250px;
overflow:auto;
}

.history-item{
padding:8px;
border-bottom:1px solid #334155;
}

</style>
</head>

<body>

<div class="header">

<h1>🚀 Automation Jenkins Dashboard</h1>

<button class="run-all" onclick="runAllTests()">Run All Tests</button>

</div>

<div class="dashboard">

<div class="card">

<h3>Test Cases</h3>

<table id="testTable">

<thead>
<tr>
<th>Test</th>
<th>Status</th>
<th>Duration</th>
<th>Last Run</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<div class="card">

<h3>PASS / FAIL Graph</h3>

<canvas id="resultChart"></canvas>

</div>

<div class="card">

<h3>Execution History</h3>

<div id="history" class="history"></div>

</div>

<div class="card">

<h3>Logs</h3>

<div id="logs" class="logs">Logs will appear here...</div>

</div>

</div>

<script>

const API="http://127.0.0.1:8000";

let chart;

function createChart(pass,fail){

const ctx=document.getElementById("resultChart");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:'doughnut',
data:{
labels:['PASS','FAIL'],
datasets:[{
data:[pass,fail],
backgroundColor:['#22c55e','#ef4444']
}]
}
});

}

async function loadTests(){

const response=await fetch(API+"/automation/get-tests");

const data=await response.json();

const table=document.querySelector("#testTable tbody");

table.innerHTML="";

let pass=0;
let fail=0;

data.tests.forEach(test=>{

if(test.status==="PASS") pass++;
if(test.status==="FAIL") fail++;

table.innerHTML+=`
<tr>
<td>${test.name}</td>
<td class="${test.status==='PASS'?'pass':'fail'}">${test.status}</td>
<td>${test.duration}</td>
<td>${test.last_run}</td>
<td>
<button class="run" onclick="runTest('${test.name}')">Run</button>
</td>
</tr>
`;

});

createChart(pass,fail);

}

async function runTest(name){

document.getElementById("logs").innerHTML="Running "+name+"...";

const response=await fetch(API+"/automation/run-test/"+name,{method:"POST"});

const data=await response.json();

document.getElementById("logs").innerText=
data.result.stdout+"\n"+data.result.stderr;

loadTests();
loadHistory();

}

async function runAllTests(){

document.getElementById("logs").innerHTML="Running all tests...";

const response=await fetch(API+"/automation/run-all-tests",{method:"POST"});

const data=await response.json();

document.getElementById("logs").innerText=data.stdout;

loadTests();
loadHistory();

}

async function loadHistory(){

const response=await fetch(API+"/automation/history");

const data=await response.json();

const history=document.getElementById("history");

history.innerHTML="";

data.history.forEach(item=>{

history.innerHTML+=`
<div class="history-item">
<b>${item.test}</b> - ${item.status} - ${item.time}
</div>
`;

});

}

loadTests();
loadHistory();

</script>

</body>
</html>
