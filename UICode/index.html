<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automation Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:
linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
url("background.jpg");
background-size:cover;
background-position:center;
}

.card{
background:rgba(30,41,59,0.9);
border-radius:8px;
}

.header{
background:#020617;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:20px;
margin:0;
}

.run-all{
background:#22c55e;
border:none;
padding:6px 14px;
border-radius:5px;
color:white;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.stats{
display:flex;
gap:10px;
padding:10px 20px;
}

.stat-box{
flex:1;
background:#1e293b;
padding:10px;
border-radius:6px;
text-align:center;
}

.stat-number{
font-size:18px;
font-weight:bold;
margin-top:5px;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
align-items:start;
}

.card{
background:#1e293b;
padding:10px;
border-radius:6px;
min-height:auto;
}

.card h3{
font-size:14px;
margin-bottom:8px;
}


table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

th{
font-size:12px;
color:#cbd5f5;
}

th,td{
padding:5px;
border-bottom:1px solid #334155;
}

.pass{color:#22c55e;}
.fail{color:#ef4444;}
.running{color:#f59e0b;}

button.run{
background:#3b82f6;
border:none;
padding:4px 10px;
border-radius:4px;
font-size:12px;
color:white;
cursor:pointer;
}

.logs{
background:black;
color:#00ff00;
padding:10px;
height:150px;
overflow:auto;
font-family:monospace;
font-size:12px;
}

.history{
height:120px;
overflow:auto;
font-size:12px;
}

.history-item{
padding:5px;
border-bottom:1px solid #334155;
}

.progress{
height:10px;
background:#334155;
border-radius:6px;
overflow:hidden;
margin-top:8px;
}

.progress-bar{
height:100%;
width:0%;
background:#22c55e;
}

.chart-box{
width:180px;
margin:auto;
}

#resultChart{
max-height:160px;
max-width:160px;
margin:auto;
}

</style>
</head>

<body>

<div class="header">
<h1>🚀 Automation Dashboard</h1>
<button class="run-all" onclick="runAllTests()">Run All Tests</button>
</div>

<!-- STATS -->

<div class="stats">

<div class="stat-box">
Total Tests
<div id="totalTests" class="stat-number">0</div>
</div>

<div class="stat-box">
PASS
<div id="passCount" class="stat-number pass">0</div>
</div>

<div class="stat-box">
FAIL
<div id="failCount" class="stat-number fail">0</div>
</div>

<div class="stat-box">
Running
<div id="runningCount" class="stat-number running">0</div>
</div>

</div>

<div class="dashboard">

<!-- TEST TABLE -->

<div class="card">

<h3>Test Cases</h3>

<table id="testTable">

<thead>
<tr>
<th>Test</th>
<th>Status</th>
<th>Duration</th>
<th>Last Run</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<!-- GRAPH -->

<div class="card">

<h3>PASS / FAIL Graph</h3>

<div class="chart-box">
<canvas id="resultChart"></canvas>
</div>

<h3 style="margin-top:20px;">Execution Progress</h3>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

</div>

<!-- HISTORY -->

<div class="card">

<h3>Execution History</h3>

<div id="history" class="history"></div>

</div>

<!-- LOGS -->

<div class="card">

<h3>Live Logs</h3>

<div id="logs" class="logs">Waiting for execution...</div>

</div>

</div>

<script>

const API="http://127.0.0.1:8000";

let chart;

function createChart(pass,fail){

const ctx=document.getElementById("resultChart");

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:'doughnut',
data:{
labels:['PASS','FAIL'],
datasets:[{
data:[pass,fail],
backgroundColor:['#22c55e','#ef4444']
}]
}
});

}

async function loadTests(){

const response=await fetch(API+"/automation/get-tests");

const data=await response.json();

const table=document.querySelector("#testTable tbody");

table.innerHTML="";

let pass=0;
let fail=0;

data.tests.forEach(test=>{

if(test.status==="PASS") pass++;
if(test.status==="FAIL") fail++;

table.innerHTML+=`
<tr>
<td>${test.name}</td>
<td class="${test.status==='PASS'?'pass':test.status==='FAIL'?'fail':'running'}">${test.status}</td>
<td>${test.duration}</td>
<td>${test.last_run}</td>
<td>
<button class="run" onclick="runTest('${test.name}')">Run</button>
</td>
</tr>
`;

});

document.getElementById("totalTests").innerText=data.tests.length;
document.getElementById("passCount").innerText=pass;
document.getElementById("failCount").innerText=fail;

createChart(pass,fail);

}

async function runTest(name){

document.getElementById("logs").innerHTML="Running "+name+"...";

const response=await fetch(API+"/automation/run-test/"+name,{method:"POST"});

const data=await response.json();

document.getElementById("logs").innerText=data.result.stdout;

loadTests();
loadHistory();

}

async function runAllTests(){

document.getElementById("logs").innerHTML="Running all tests...";

const response=await fetch(API+"/automation/run-all-tests",{method:"POST"});

const data=await response.json();

document.getElementById("logs").innerText=data.stdout;

loadTests();
loadHistory();

}

async function loadHistory(){

const response=await fetch(API+"/automation/history");

const data=await response.json();

const history=document.getElementById("history");

history.innerHTML="";

data.history.forEach(item=>{

history.innerHTML+=`
<div class="history-item">
<b>${item.test}</b> - ${item.status} - ${item.time}
</div>
`;

});

}

loadTests();
loadHistory();

</script>

</body>
</html>
